# FDP Registry
# One entry per FAIR Data Point root resource.
#
# Fields:
#   url:     FDP root URL — must be reachable over HTTPS (required)
#   label:   human-readable name (optional, discovered from metadata if absent)
#   added:   ISO 8601 date first registered
#   contact: maintainer (optional)
#   notes:   any known quirks for the crawler (optional)
#
# Only add URLs that are actually deployed and reachable.
# Use workflow_dispatch ("Run workflow") to test a new entry manually.

fdps:

  # ── Live FDPs — confirmed reachable ───────────────────────────────────────

  - url:     https://fdp.duchennedatafoundation.org
    label:   "Duchenne FAIR Data Point"
    added:   "2026-04-16"
    contact: ""

  - url:     https://fdp.wikipathways.org/index.ttl
    label:   "WikiPathways FAIR Data Point"
    added:   "2026-04-16"
    contact: ""

  - url:     https://fdp.dcc.sib.swiss
    label:   "SPHN FAIR Data Point (SIB Swiss)"
    added:   "2026-04-16"
    contact: "fair-data-team@sib.swiss"
    notes:   >
      Internal IRIs use http:// while the server is https://.
      Label/description extraction falls back to URL string — data is complete.
      Has 15 catalogs; ensure MAX_HOPS is set high enough.

  - url:     http://fairdatapointorphanet.info:7070
    label:   "Orphanet — Patient Registries & Biobanks + ORPHADATA"
    added:   "2026-04-12"
    contact: "https://www.orpha.net"
    notes:   >
      HTTP only, non-standard port 7070. No HTTPS available.
      Two catalogs:
        (1) "The Orphanet catalogue of registries and biobanks" — 4000+ patient
            registry resources typed as ejp-rd:PatientRegistry, each carrying a
            dcat:theme ORDO IRI (e.g. Orphanet_92 for JIA). Also contains biobanks.
        (2) "ORPHADATA" — Orphanet's machine-readable knowledge-base exports
            (rare disease nomenclature, epidemiology, gene–disease associations,
            phenotypes, natural history). License CC BY 4.0.
      Uses EJP-RD vocabulary (personalData, vpConnection=VPDiscoverable).
      Crawler must follow http:// IRIs and handle non-standard port.
      MAX_HOPS should be set high (catalog alone has 4000+ member resources).

  - url:     https://dpp.worldduchenne.org
    label:   "Duchenne Parent Project — FAIR Data Point"
    added:   "2026-04-12"
    contact: "https://www.worldduchenne.org/"
    notes:   >
      FDP v1.17.1; canonical w3id IRI is https://w3id.org/duchenne-fdp but
      the actual server is dpp.worldduchenne.org (use this URL for crawling).
      Themes: ordo:Orphanet_98895 (DMD) and ordo:Orphanet_98896 (Becker MD).
      Uses EJP-RD vocabulary (personalData, vpConnection=VPDiscoverable).
      License: CC-BY-NC-ND 3.0 (root), EJP-RD license (catalog).
      One catalog ("Duchenne Data Platform Catalog") published by
      FAIR Data Systems S.L. on behalf of Duchenne Parent Project.
      Conceptual metadata only — for data access contact the publisher.

  - url:     https://rajaramzfdp.fdpcloud.org/fdp-content/repository
    label:   "rajaramz-fdp demo"
    added:   "2026-04-16"
    contact: ""

  - url:     https://koetai.github.io/biodiversity-fdp/fdp/biodiversity-index/catalog.ttl
    label:   "Biodiversity FDP"
    added:   "2026-10-08"
    contact: "https://github.com/Koetai/biodiversity-fdp"
    notes:   >
      Lean FDP built with LeanFDP/fdp-ecosystem-template; served as text/turtle by GitHub Pages.
      The index lists its catalog documents with ldp:contains (and fdp:hasCatalog → rdfs:seeAlso);
      canonical IRIs are https://raw.githubusercontent.com/Koetai/biodiversity-fdp/main/fdp/…,
      the same files are served with text/turtle under https://koetai.github.io/biodiversity-fdp/fdp/….

